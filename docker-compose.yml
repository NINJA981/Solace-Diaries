services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: solace
      POSTGRES_PASSWORD: solace
      POSTGRES_DB: solace
    ports:
      - '55432:5432'
    volumes:
      - solace-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solace -d solace']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  solace-db:
